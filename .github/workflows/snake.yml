name: generate animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: minaa9
          outputs: |
            dist/github-snake.svg?color_snake=%23d4a843&color_dots=%23161512,%233d2410,%235c3a18,%23a8792f,%23d4a843&color_animals=%23f2e8d4

      - uses: actions/upload-artifact@v4
        with:
          name: github-contribution-grid-snake
          path: dist/

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
